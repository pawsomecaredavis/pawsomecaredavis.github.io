<!DOCTYPE html>

  <header class="site-header">

      <a class="logo" href="index.html#home" aria-label="Pawsome Care home">

          <figure class="gallery-card">
            <img src="homepage-dogs.png" alt="Close-up of dogs enjoying time together">
            <figcaption>Small-group care with plenty of comfort and supervision.</figcaption>
          </figure>

          <figure class="gallery-card">
            <img src="homepage-dogs.png" alt="Dogs in the Pawsome Care environment">
